<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>三国部落</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: #1a0e08; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            font-family: 'Microsoft YaHei', sans-serif;
        }
        .container { 
            background: #2c1810; 
            padding: 40px; 
            border-radius: 20px; 
            border: 2px solid #b8860b; 
            width: 380px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
        }
        h1 { text-align: center; color: #ffd700; margin-bottom: 5px; }
        .sub { text-align: center; color: #c0a060; margin-bottom: 25px; font-size: 14px; }
        .tab { display: flex; margin-bottom: 20px; }
        .tab button { 
            flex: 1; padding: 10px; background: #3a2218; border: none; 
            color: #8a7a6a; font-size: 16px; cursor: pointer; 
            transition: 0.3s; border-radius: 8px 8px 0 0; 
        }
        .tab button.active { background: #5a3a2a; color: #ffd700; border-bottom: 3px solid #ffd700; }
        .form-group { margin-bottom: 18px; }
        label { display: block; color: #d4c4a0; margin-bottom: 5px; font-size: 14px; }
        input { 
            width: 100%; padding: 12px; background: #1a0e08; 
            border: 1px solid #5a3a2a; border-radius: 8px; 
            color: #f0e0c0; font-size: 16px; outline: none; 
        }
        input:focus { border-color: #ffd700; }
        .btn { 
            width: 100%; padding: 12px; background: #b8860b; 
            border: none; border-radius: 8px; color: #fff; 
            font-size: 18px; font-weight: bold; cursor: pointer; 
            transition: 0.3s; 
        }
        .btn:hover { background: #daa520; }
        .msg { text-align: center; margin-top: 15px; font-size: 14px; min-height: 20px; }
        .msg.success { color: #7bed9f; }
        .msg.error { color: #ff6b6b; }
    </style>
</head>
<body>
<div class="container">
    <h1>⚔️ 群雄割据</h1>
    <div class="sub">十二路诸侯 · 逐鹿中原</div>
    
    <div class="tab">
        <button id="tabLogin" class="active" onclick="switchTab('login')">登录</button>
        <button id="tabRegister" onclick="switchTab('register')">注册</button>
    </div>

    <div id="loginForm">
        <div class="form-group"><label>账号</label><input id="loginUser" placeholder="输入用户名"></div>
        <div class="form-group"><label>密码</label><input id="loginPass" type="password" placeholder="输入密码"></div>
        <button class="btn" onclick="handleLogin()">进入大营</button>
    </div>

    <div id="registerForm" style="display:none;">
        <div class="form-group"><label>新账号</label><input id="regUser" placeholder="至少3个字符"></div>
        <div class="form-group"><label>密码</label><input id="regPass" type="password" placeholder="设置密码"></div>
        <div class="form-group"><label>部落名（可选）</label><input id="regTribe" placeholder="例如：西凉铁骑"></div>
        <button class="btn" onclick="handleRegister()">揭竿而起</button>
    </div>

    <div id="message" class="msg"></div>
</div>

<script>
    function switchTab(type) {
        document.getElementById('loginForm').style.display = type === 'login' ? 'block' : 'none';
        document.getElementById('registerForm').style.display = type === 'register' ? 'block' : 'none';
        document.getElementById('tabLogin').className = type === 'login' ? 'active' : '';
        document.getElementById('tabRegister').className = type === 'register' ? 'active' : '';
        document.getElementById('message').className = 'msg';
        document.getElementById('message').innerText = '';
    }

    async function handleLogin() {
        const username = document.getElementById('loginUser').value;
        const password = document.getElementById('loginPass').value;
        const msg = document.getElementById('message');
        if (!username || !password) {
            msg.className = 'msg error';
            return msg.innerText = '请填写完整信息';
        }

        try {
            const res = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            const data = await res.json();
            if (data.success) {
                window.location.href = '/dashboard.html';
            } else {
                msg.className = 'msg error';
                msg.innerText = '❌ ' + data.msg;
            }
        } catch (e) {
            msg.className = 'msg error';
            msg.innerText = '❌ 连接服务器失败，请检查是否启动';
        }
    }

    async function handleRegister() {
        const username = document.getElementById('regUser').value;
        const password = document.getElementById('regPass').value;
        const tribeName = document.getElementById('regTribe').value;
        const msg = document.getElementById('message');
        
        if (!username || !password) {
            msg.className = 'msg error';
            return msg.innerText = '账号密码不能为空';
        }
        if (username.length < 3) {
            msg.className = 'msg error';
            return msg.innerText = '账号至少3个字符';
        }

        try {
            const res = await fetch('/api/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password, tribeName })
            });
            const data = await res.json();
            if (data.success) {
                msg.className = 'msg success';
                msg.innerText = '✅ ' + data.msg + ' 请切换到登录！';
                document.getElementById('regUser').value = '';
                document.getElementById('regPass').value = '';
                document.getElementById('regTribe').value = '';
            } else {
                msg.className = 'msg error';
                msg.innerText = '❌ ' + data.msg;
            }
        } catch (e) {
            msg.className = 'msg error';
            msg.innerText = '❌ 连接服务器失败，请检查是否启动';
        }
    }
</script>
</body>
</html>
